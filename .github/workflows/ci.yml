name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execução por branch/PR: um push novo cancela a anterior ainda em andamento.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mesma versão das imagens (docker/*.Dockerfile usam node:24-alpine).
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend (lint, tipos, build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      # Banco só dos testes e2e. O nome termina em _test: a guarda de test/setup
      # recusa qualquer banco que não siga essa regra.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Checagem de tipos
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Testes unitários (com cobertura)
        run: npm run test:cov

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Testes e2e (Postgres do service container)
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test
          THROTTLE_DISABLED: 'true'
        run: npm run test:e2e

  frontend:
    name: Frontend (tipos e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar o docker-compose.yml com o .env.example
        if: ${{ matrix.image == 'backend' }}
        run: docker compose --env-file .env.example config --quiet

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Só constrói a imagem (sem push): garante que o Dockerfile continua válido.
      - name: Build da imagem ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
