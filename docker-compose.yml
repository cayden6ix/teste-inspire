name: api-projetos-tarefas

# Imagem unica do backend, usada pelo servico `migrate` (one-shot) e pela API.
# O build fica so no `backend`; o `migrate` reaproveita a mesma tag, entao a
# imagem e construida uma unica vez.
x-backend-image: &backend-image api-projetos-tarefas/backend:local

# Ambiente comum a API e as migrations.
x-backend-env: &backend-env
  # Imagem de producao roda como producao. O SSL do banco e decidido por
  # DATABASE_SSL (o Postgres do compose nao oferece SSL), e nao pelo NODE_ENV.
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app_db}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  DATABASE_LOGGING: '${DATABASE_LOGGING:-false}'

services:
  postgres:
    image: postgres:17-alpine
    container_name: api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations pendentes e encerra (D-018: migration fora do boot da API).
  # A API so sobe depois que este servico termina com sucesso.
  migrate:
    image: *backend-image
    container_name: api-migrate
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
    command: ['npm', 'run', 'migration:run']
    healthcheck:
      disable: true

  backend:
    image: *backend-image
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: api-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      PORT: 3000
      API_PREFIX: api
      # Schema gerenciado por migrations (D-002, D-018), aplicadas pelo servico `migrate`.
      DATABASE_SYNCHRONIZE: 'false'
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env da raiz (veja .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SWAGGER_ENABLED: '${SWAGGER_ENABLED:-true}'
      # Padrao 1 so no compose (no app o padrao e false): a API fica atras do nginx
      # do frontend, e sem confiar nesse salto todo o trafego cairia num unico balde
      # do rate limit (IP do nginx). Com 1, o IP real vem do X-Forwarded-For.
      TRUST_PROXY: '${TRUST_PROXY:-1}'
      THROTTLE_DISABLED: '${THROTTLE_DISABLED:-false}'
      THROTTLE_TTL_SECONDS: ${THROTTLE_TTL_SECONDS:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      THROTTLE_AUTH_LOGIN_LIMIT: ${THROTTLE_AUTH_LOGIN_LIMIT:-10}
      THROTTLE_AUTH_REGISTER_LIMIT: ${THROTTLE_AUTH_REGISTER_LIMIT:-5}
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: api-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:80'

volumes:
  postgres-data:
