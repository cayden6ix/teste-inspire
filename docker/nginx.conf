server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncia a versao do nginx nas respostas e paginas de erro.
    server_tokens off;

    # Cabecalho com o endereco da API para o browser. Em desenvolvimento o
    # proxy e feito pelo Vite (frontend/vite.config.ts); aqui o proxy e feito
    # pelo proprio nginx, de modo que a regra de rotas do browser e identica
    # nos dois ambientes.
    # Sem add_header aqui: os cabecalhos de seguranca vem do helmet da API.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Documentacao do Swagger (gerada pela API, com a CSP do helmet que o Swagger UI precisa).
    location /docs {
        proxy_pass http://backend:3000/docs;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai no index.html para o React Router resolver.
    # `no-cache`: o navegador revalida o index.html a cada visita (ETag/Last-Modified), entao
    # um deploy novo nunca fica preso a um HTML antigo apontando para o bundle anterior.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome podem ser cacheados para sempre. Um unico Cache-Control,
    # sem `expires` (que geraria um segundo Cache-Control: max-age). Sem source maps no
    # build de producao (vite.config.ts): /assets/*.map responde 404.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # Sem `always`: um 404 (asset inexistente) nao pode ficar em cache por 1 ano.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
