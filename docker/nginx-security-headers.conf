# Cabecalhos de seguranca do SPA (HTML e assets servidos pelo proprio nginx), D-032.
#
# Incluido SO nas locations do SPA (`/` e `/assets/`), nunca no nivel do server: as rotas
# com proxy (`/api/` e `/docs`) ja recebem os cabecalhos do helmet da API, e um add_header
# no server seria herdado por elas e duplicaria (ou contradiria) os da API. Lembrete do
# nginx: uma location com qualquer add_header proprio deixa de herdar os do nivel acima,
# por isso este arquivo e incluido inteiro em cada location que precisa dele.
#
# `always`: vale tambem para respostas de erro (404 de um asset inexistente, por exemplo).

# CSP compativel com o build do Vite: so <script type="module" src> e <link rel=stylesheet>
# do proprio dominio, sem script ou estilo inline; a API e chamada na mesma origem (/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
